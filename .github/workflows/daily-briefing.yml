name: Daily briefing

on:
  schedule:
    # GitHub cron is in UTC (Central is UTC-6 in winter, UTC-5 in summer), and GitHub often starts
    # scheduled runs late or skips them, so there are several tries.
    # Morning: twice an hour from 7:17 to 9:47 AM Central. Once today's briefing exists, these stop.
    - cron: "17,47 13-15 * * *"
    # Refreshes on weekdays: around 11:17 AM, 1:17 PM and 3:47 PM Central (after the close), and 7:17 PM.
    # These rebuild today's briefing with the latest news and prices, unless the Claude task wrote it.
    - cron: "17 17,19 * * 1-5"
    - cron: "47 21 * * 1-5"
    - cron: "17 1 * * 2-6"
  workflow_dispatch:  # adds a "Run workflow" button on the Actions tab
    inputs:
      force:
        description: "Rebuild even if today's briefing already exists (replaces it)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to build
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          f="briefings/$(date +%Y-%m-%d).json"
          skip=false
          if [ -f "$f" ] && [ "$FORCE" != "true" ]; then
            if [ "$SCHEDULE" = "17,47 13-15 * * *" ]; then
              echo "$f already published this morning, nothing to do."
              skip=true
            elif ! grep -q '"source": "free-agent"' "$f"; then
              echo "$f was written by the Claude task, keeping it."
              skip=true
            else
              echo "Refreshing $f with the latest news and prices."
            fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build today's briefing from news feeds and market data
        if: steps.check.outputs.skip != 'true'
        run: python agent.py

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "Opening Bell Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash publish.sh
