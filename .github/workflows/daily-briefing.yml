name: Daily briefing

on:
  schedule:
    # GitHub cron is in UTC, and GitHub often starts scheduled runs late or skips them entirely,
    # so it tries twice an hour from 13:17 to 20:47 UTC (7:17 AM to 2:47 PM Central in winter).
    # Every try after the first successful one sees today's briefing and stops within seconds.
    - cron: "17,47 13-20 * * *"
  workflow_dispatch:  # adds a "Run workflow" button on the Actions tab
    inputs:
      force:
        description: "Rebuild even if today's briefing already exists (replaces it)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's briefing already exists
        id: check
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          f="briefings/$(date +%Y-%m-%d).json"
          if [ -f "$f" ] && [ "$FORCE" != "true" ]; then
            echo "$f already published (by an earlier run or the Claude task), nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.check.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Build today's briefing from news feeds and market data
        if: steps.check.outputs.skip != 'true'
        run: python agent.py

      - name: Publish
        if: steps.check.outputs.skip != 'true'
        run: |
          git config user.name "Opening Bell Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash publish.sh
