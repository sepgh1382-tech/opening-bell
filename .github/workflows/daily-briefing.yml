name: Daily briefing

on:
  schedule:
    # GitHub cron is in UTC. 13:17 UTC is 7:17 AM Central in winter and 8:17 AM in summer,
    # before the 8:30 AM Central market open either way. GitHub can start scheduled runs late.
    - cron: "17 13 * * *"
  workflow_dispatch: {}  # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: America/Chicago
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Research and write today's briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python agent.py

      - name: Publish
        run: |
          git config user.name "Opening Bell Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash publish.sh
